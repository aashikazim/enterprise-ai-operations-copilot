name: Offline regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: ci-disposable-password
          POSTGRES_DB: copilot_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_db"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://copilot:ci-disposable-password@127.0.0.1:5432/copilot_db
      JWT_SECRET_KEY: ci-only-not-for-deployment
      OPENAI_API_KEY: ""
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip==26.2.0
      - run: python -m pip install -r requirements.txt
      - run: python -m scripts.prepare_test_database
      - run: python -m scripts.prepare_test_database --database copilot_migration_test_db
      - run: python -m pytest tests/ -q -p no:cacheprovider --tb=short
      - run: python scripts/check_secrets.py
      - name: Audit installed dependencies with isolated auditor
        run: |
          python -m venv /tmp/copilot-audit
          /tmp/copilot-audit/bin/python -m pip install pip-audit==2.10.1
          /tmp/copilot-audit/bin/pip-audit --path "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test -- --reporter=dot
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend audit --audit-level=low
      - run: docker compose --env-file .env.example -f docker-compose.yml -f docker-compose.deploy.yml config --quiet
