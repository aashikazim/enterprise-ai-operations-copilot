server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    # Docker DNS: backend container addresses can change during replacement.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream backend:8000;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    client_max_body_size 1m;
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # Authorization is forwarded, never written to the access log.
        access_log off;
    }
    location / {
        try_files $uri /index.html;
    }
}
